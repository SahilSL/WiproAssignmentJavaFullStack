<!DOCTYPE html>
<html>
<head>
  <title>Book Store Management</title>
</head>
<body>
  <script>

    let books = [
                            {
                                title: "HTML & CSS",
                                author: "SahilSL",
                                price: 450,
                                available: true
                            },

                            {
                                title: "JS",
                                author: "Mr. S. Lokhande",
                                price: 350,
                                available: false
                            }
    ];

    // Display all books using for of
    let allBooksOutput = "All Books:\n";
    for (const book of books) {
      allBooksOutput += `Title: ${book.title}, Author: ${book.author}, Price: Rs.${book.price}, Available: ${book.available}\n`;
    }
    alert(allBooksOutput);

    // Display only available books | availabel =true
    let availableBooksOutput = "Available Books:\n";
    for (const book of books) {
      if (book.available) {
        availableBooksOutput += `Title: ${book.title}, Author: ${book.author}, Price: Rs.${book.price}\n`;
      }
    }
    alert(availableBooksOutput);

    // Add a new book to JSON array
    const newBook = {
      title: "Java",
      author: "Sun Microsystem",
      price: 499,
      available: true
    };
    books.push(newBook);

    // print after adding
    let afterAddOutput = "After Adding:\n";
    afterAddOutput += books.map(book => book.title).join(" , ");
    alert(afterAddOutput);

    // Update price of a specific book
    for (const book of books) {
      if (book.title === "JS") {
        book.price = 999;
        break;
      }
    }

    // Show updated price
    let afterPriceUpdate = "After Price Update:\n";
    for (const book of books) {
      if (book.title === "JS") {
        afterPriceUpdate += `${book.title} - Rs.${book.price}`;
      }
    }
    alert(afterPriceUpdate);

    // Delete a book
    books = books.filter(book => book.title !== "JS");

    // Show titles after deletion
    let afterDeleteOutput = "After Deletion:\n";
    afterDeleteOutput += books.map(book => book.title).join(" , ");
    alert(afterDeleteOutput);
  </script>
</body>
</html>
