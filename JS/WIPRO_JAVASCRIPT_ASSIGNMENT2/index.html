<!DOCTYPE html>
<html>
<head>
  <title>Income Tax Calculator</title>
</head>
<body>
  <script>
    const fullName = prompt("Enter your full name:");
    let panNumber = prompt("Enter your PAN number (10 characters):");
    let dobInput = prompt("Enter your Date of Birth (YYYY-MM-DD):");
    let annualIncome = parseFloat(prompt("Enter your Annual Income (₹):"));

    panNumber = panNumber.toUpperCase();
    if (panNumber.length !== 10) {
      alert("Invalid PAN number. It must be exactly 10 characters.");
      throw new Error("Invalid PAN number.");
    }

    const dob = new Date(dobInput);
    const today = new Date();
    let age = today.getFullYear() - dob.getFullYear();
    const m = today.getMonth() - dob.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) {
      age--;
    }

    let tax = 0;
    if (annualIncome <= 250000) {
      tax = 0;
    } else if (annualIncome <= 500000) {
      tax = 0.05 * (annualIncome - 250000);
    } else if (annualIncome <= 1000000) {
      tax = 0.05 * 250000 + 0.20 * (annualIncome - 500000);
    } else {
      tax = 0.05 * 250000 + 0.20 * 500000 + 0.30 * (annualIncome - 1000000);
    }

    tax = Math.round(tax);

    const output = `
            Name: ${fullName.toUpperCase()}
            PAN: ${panNumber}
            Age: ${age} years
            Annual Income: ₹${annualIncome}
            Calculated Tax: ₹${tax}`;
    alert(output);
  </script>
</body>
</html>
