<!-- 1.Servlets Form Handling:
User opens studentForm.html
1.
Fills the registration form
2.
On submit, form data is sent to /register
3.
RegisterServlet displays all the submitted data -->

<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>
<body>
    <h2>Student Registration Form</h2><br>
    <h2>Assignment 1 - Servlets Form Handling</h2>
    <form action="register" method="post">
        Name: <input type="text" name="name"><br><br>
        Age: <input type="number" name="age"><br><br>
        Email: <input type="email" name="email"><br><br>
        <input type="submit" value="Register">
    </form>
</body>
</html>
